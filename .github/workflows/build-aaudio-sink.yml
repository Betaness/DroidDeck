name: Build AAudio sink module

on:
  push:
    paths:
      - 'tools/aaudio-sink/**'
      - '.github/workflows/build-aaudio-sink.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    # [mali-g2] Pushes to forks (the G2 branches) do not rebuild upstream's components; run it by hand there.
    if: github.repository == 'Droid-Deck/DroidDeck' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: PulseAudio 13.0 source
        run: |
          set -euo pipefail
          curl -fsSL -o pa.tar.gz https://github.com/pulseaudio/pulseaudio/archive/refs/tags/v13.0.tar.gz
          mkdir -p pa13 && tar -xzf pa.tar.gz -C pa13 --strip-components=1
      - name: Build
        run: |
          set -euo pipefail
          export NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          tools/aaudio-sink/build.sh "$PWD/pa13" "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: audio-sink-modules
          path: out/*.so
